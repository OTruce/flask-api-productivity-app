services:
  - type: web
    name: workout-log-api
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt && flask db upgrade"
    startCommand: "gunicorn app:app"
    envVars:
      - key: FLASK_APP
        value: app.py
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: workout-log-db
          property: connectionString
      - key: CORS_ORIGINS
        value: "http://localhost:3000"
      - key: PYTHON_VERSION
        value: "3.11.9"

databases:
  - name: workout-log-db
    plan: free
